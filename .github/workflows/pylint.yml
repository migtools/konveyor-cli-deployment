name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install only packages imported by linted modules (avoid pins that break older Python).
        pip install pylint 'paramiko~=3.5.0' 'requests~=2.32.3' 'pyyaml~=6.0.2'
    - name: Analysing the code with pylint
      run: |
        # Local package imports (utils.*) need the repo root on PYTHONPATH.
        # fail-under matches current baseline after fixing import resolution;
        # raise as style debt is paid down.
        PYTHONPATH=. pylint --fail-under=6.0 $(git ls-files '*.py')
