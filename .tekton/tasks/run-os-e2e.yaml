apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: run-os-e2e
  annotations:
    description: |
      Provision an AMI-backed EC2 VM for one OS lane, deploy stage CLI, run tier0
      pytest, collect reports, and terminate or TTL-tag the instance. Always exits 0
      after writing testStatus so sibling lanes and aggregate still run.
      Uses Task-local emptyDir (no Pipeline workspace required).
spec:
  params:
    - name: targetOs
      description: Target OS for deploy tooling (linux|windows|darwin)
      type: string
    - name: ami
      description: AMI ID for this lane
      type: string
    - name: instanceType
      description: EC2 instance type
      type: string
    - name: sshUser
      description: SSH user for this lane
      type: string
    - name: platform
      description: CLI binary platform (amd64|arm64)
      type: string
    - name: awsRegion
      description: AWS region
      type: string
    - name: keyName
      description: EC2 key pair name
      type: string
    - name: securityGroupId
      description: Optional security group ID
      type: string
      default: ""
    - name: subnetId
      description: Optional subnet ID
      type: string
      default: ""
    - name: testCommand
      description: Remote pytest command
      type: string
    - name: failureTtlHours
      description: Hours to keep failed VMs tagged
      type: string
      default: "24"
    - name: sshRetries
      description: SSH wait retries (10s sleep each); Darwin often needs more
      type: string
      default: "60"
    - name: resultSubdir
      description: Subdirectory under /workspace/results for this lane
      type: string
    - name: pipelineRunName
      description: PipelineRun name for EC2 instance tags
      type: string
      default: "unknown"
    - name: mtaVersion
      description: MTA version from prepare-workspace
      type: string
    - name: fbcImage
      description: Component image used when preparing the lane deploy tree
      type: string
    - name: deployRepoUrl
      description: Git URL of konveyor-cli-deployment
      type: string
    - name: deployRepoRevision
      description: Git branch or tag to clone
      type: string

  results:
    - name: testStatus
      description: Lane E2E status (PASSED|FAILED)

  volumes:
    - name: work
      emptyDir: {}
    - name: aws-vm-ssh-key
      secret:
        secretName: aws-vm-ssh-key
        items:
          - key: ssh-privatekey
            path: aws-vm-login-key.pem
            mode: 0400

  steps:
    - name: run-e2e
      # Same base as prepare-workspace. Pinned 1-77.* tags are often GC'd
      # (manifest unknown → ImagePullBackOff; only place-scripts logs appear).
      image: registry.access.redhat.com/ubi9/python-311:latest
      volumeMounts:
        - name: work
          mountPath: /workspace
        - name: aws-vm-ssh-key
          mountPath: /secrets
          readOnly: true
      env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws-cli-e2e-credentials
              key: aws_access_key_id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws-cli-e2e-credentials
              key: aws_secret_access_key
        - name: GIT_TERMINAL_PROMPT
          value: "0"
      script: |
        #!/bin/bash
        set -euo pipefail
        echo "run-os-e2e starting at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo "targetOs=$(params.targetOs) ami=$(params.ami) mtaVersion=$(params.mtaVersion)"
        RESULT_DIR="/workspace/results/$(params.resultSubdir)"
        mkdir -p "$RESULT_DIR"
        write_failed() {
          echo -n "FAILED" > "$RESULT_DIR/testStatus"
          cp "$RESULT_DIR/testStatus" "$(results.testStatus.path)" || true
        }
        trap 'echo "ERROR: run-os-e2e failed at line $LINENO" >&2; write_failed; exit 0' ERR

        # ubi9/python-311 runs as non-root and ships without microdnf; git/ssh/scp
        # are already on PATH. Only pip-install awscli + deploy requirements.
        for cmd in git ssh scp python3 pip; do
          command -v "$cmd" >/dev/null 2>&1 || {
            echo "ERROR: required tool missing: $cmd" >&2
            exit 1
          }
          echo "$cmd already present: $(command -v "$cmd")"
        done

        export WORK_DIR=/workspace
        export FBC_IMAGE="$(params.fbcImage)"
        export SSH_USER="$(params.sshUser)"
        export SSH_KEY=/secrets/aws-vm-login-key.pem
        export DEPLOY_REPO_URL="$(params.deployRepoUrl)"
        export DEPLOY_REPO_REVISION="$(params.deployRepoRevision)"

        if [[ ! -f "$SSH_KEY" ]]; then
          echo "ERROR: SSH key not mounted at $SSH_KEY (secret aws-vm-ssh-key)" >&2
          exit 1
        fi
        chmod 400 "$SSH_KEY" || true

        # Each lane prepares its own emptyDir tree (no shared Pipeline workspace).
        BOOT="/tmp/cli-deploy-bootstrap"
        rm -rf "$BOOT"
        echo "Cloning ${DEPLOY_REPO_URL}@${DEPLOY_REPO_REVISION}..."
        git clone --depth 1 --branch "$DEPLOY_REPO_REVISION" "$DEPLOY_REPO_URL" "$BOOT"
        "$BOOT/.tekton/integration-tests/scripts/prepare_workspace.sh"

        # Prefer the version resolved in prepare-workspace (consistent across lanes).
        export MTA_VERSION="$(params.mtaVersion)"
        printf '%s' "$MTA_VERSION" > /workspace/artifacts/mta-version
        echo "MTA_VERSION=${MTA_VERSION}"

        pip install --quiet 'awscli'
        pip install --quiet -r /workspace/konveyor-cli-deployment/requirements.txt

        export RESULT_DIR
        export TARGET_OS="$(params.targetOs)"
        export AMI_ID="$(params.ami)"
        export INSTANCE_TYPE="$(params.instanceType)"
        export PLATFORM="$(params.platform)"
        export AWS_REGION="$(params.awsRegion)"
        export KEY_NAME="$(params.keyName)"
        export SECURITY_GROUP_ID="$(params.securityGroupId)"
        export SUBNET_ID="$(params.subnetId)"
        export TEST_COMMAND="$(params.testCommand)"
        export FAILURE_TTL_HOURS="$(params.failureTtlHours)"
        export SSH_RETRIES="$(params.sshRetries)"
        export PIPELINE_RUN_NAME="$(params.pipelineRunName)"

        # Always record status and exit 0 so sibling lanes + aggregate still run;
        # verify-results fails the PipelineRun if any lane is not PASSED.
        set +e
        /workspace/konveyor-cli-deployment/.tekton/integration-tests/scripts/run_os_e2e.sh
        set -e
        cp "$RESULT_DIR/testStatus" "$(results.testStatus.path)" || write_failed
        echo "run-os-e2e done status=$(cat "$RESULT_DIR/testStatus" 2>/dev/null || echo unknown)"
        exit 0
