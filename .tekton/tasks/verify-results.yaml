apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: verify-results
  annotations:
    description: |
      Failure gate for OS lane statuses. Exits non-zero when any lane is not PASSED.
      No Pipeline workspace required (logic is inlined).
spec:
  params:
    - name: linuxStatus
      description: Linux lane status (PASSED|FAILED)
      type: string
    - name: windowsStatus
      description: Windows lane status (PASSED|FAILED)
      type: string
    - name: darwinStatus
      description: Darwin lane status (PASSED|FAILED)
      type: string

  steps:
    - name: verify
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
      script: |
        #!/bin/bash
        set -euo pipefail
        LINUX_STATUS="$(params.linuxStatus)"
        WINDOWS_STATUS="$(params.windowsStatus)"
        DARWIN_STATUS="$(params.darwinStatus)"

        echo "linux=$LINUX_STATUS"
        echo "windows=$WINDOWS_STATUS"
        echo "darwin=$DARWIN_STATUS"

        if [[ "$LINUX_STATUS" != PASSED || "$WINDOWS_STATUS" != PASSED || "$DARWIN_STATUS" != PASSED ]]; then
          echo "One or more OS lanes failed" >&2
          exit 1
        fi
