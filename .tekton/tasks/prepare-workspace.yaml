apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: prepare-workspace
  annotations:
    description: |
      Extract MTA_VERSION from the SNAPSHOT component image before OS lanes start.
      Supports tagged FBC refs and digest-only Konflux FBC images (via related-images).
      Does not mount secrets. Timeout is set on the PipelineTask.
spec:
  params:
    - name: fbcImage
      description: Component/FBC image reference from parse-metadata
      type: string
    - name: deployRepoUrl
      description: Git URL of konveyor-cli-deployment
      type: string
    - name: deployRepoRevision
      description: Git branch or tag to clone for extract helpers
      type: string

  results:
    - name: prepareStatus
      description: Preparation status (PASSED|FAILED)
    - name: mtaVersion
      description: MTA version extracted from the component image

  steps:
    - name: prepare
      image: registry.access.redhat.com/ubi9/python-311:latest
      env:
        - name: FBC_IMAGE
          value: $(params.fbcImage)
        - name: DEPLOY_REPO_URL
          value: $(params.deployRepoUrl)
        - name: DEPLOY_REPO_REVISION
          value: $(params.deployRepoRevision)
        - name: GIT_TERMINAL_PROMPT
          value: "0"
      script: |
        #!/bin/bash
        set -euo pipefail
        echo "prepare-workspace starting at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo "FBC_IMAGE=${FBC_IMAGE}"
        echo "DEPLOY_REPO_URL=${DEPLOY_REPO_URL}"
        echo "DEPLOY_REPO_REVISION=${DEPLOY_REPO_REVISION}"

        trap 'echo -n FAILED > "$(results.prepareStatus.path)"' ERR

        if ! command -v git >/dev/null 2>&1; then
          echo "git missing; installing..."
          if command -v microdnf >/dev/null 2>&1; then
            microdnf install -y git && microdnf clean all
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y git && dnf clean all
          else
            echo "ERROR: git not found and no microdnf/dnf available" >&2
            exit 1
          fi
        else
          echo "git already present: $(command -v git)"
        fi

        BOOT="/tmp/cli-deploy-bootstrap"
        rm -rf "$BOOT"
        echo "Cloning ${DEPLOY_REPO_URL}@${DEPLOY_REPO_REVISION}..."
        git clone --depth 1 --branch "$DEPLOY_REPO_REVISION" "$DEPLOY_REPO_URL" "$BOOT"

        echo "Extracting MTA version from image..."
        MTA_VERSION="$("$BOOT/.tekton/integration-tests/scripts/extract_version_from_image.sh" "$FBC_IMAGE")"
        echo "MTA_VERSION=${MTA_VERSION}"

        printf '%s' "$MTA_VERSION" > "$(results.mtaVersion.path)"
        echo -n PASSED > "$(results.prepareStatus.path)"
        echo "prepare-workspace done"
