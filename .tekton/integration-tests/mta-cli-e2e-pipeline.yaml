              set +e
              /workspace/konveyor-cli-deployment/.tekton/integration-tests/scripts/run_os_e2e.sh
              set -e
              cp "$RESULT_DIR/testStatus" "$(results.testStatus.path)"
              # Always succeed the TaskRun; aggregate is the gate
              exit 0

    - name: aggregate-results
      runAfter:
        - linux-e2e
        - windows-e2e
        - darwin-e2e
      params:
        - name: linuxStatus
          value: $(tasks.linux-e2e.results.testStatus)
        - name: windowsStatus
          value: $(tasks.windows-e2e.results.testStatus)
        - name: darwinStatus
          value: $(tasks.darwin-e2e.results.testStatus)
      workspaces:
        - name: shared-workspace
          workspace: shared-workspace
      taskSpec:
        params:
          - name: linuxStatus
          - name: windowsStatus
          - name: darwinStatus
        results:
          - name: summary
            description: Aggregate OS lane summary
        workspaces:
          - name: shared-workspace
            mountPath: /workspace
        steps:
          - name: aggregate
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/bin/bash
              set -euo pipefail
              # aggregate_results.sh cats status *files*; materialize task results.
              printf '%s' "$(params.linuxStatus)" > /tmp/linuxStatus
              printf '%s' "$(params.windowsStatus)" > /tmp/windowsStatus
              printf '%s' "$(params.darwinStatus)" > /tmp/darwinStatus
              /workspace/konveyor-cli-deployment/.tekton/integration-tests/scripts/aggregate_results.sh \
                /tmp/linuxStatus \
                /tmp/windowsStatus \
                /tmp/darwinStatus \
                "$(results.summary.path)"
