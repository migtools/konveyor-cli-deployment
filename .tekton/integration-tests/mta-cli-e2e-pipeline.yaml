# MTA CLI E2E integration pipeline (Konflux IntegrationTestScenario).
#
# Thin Pipeline wiring Tasks from .tekton/tasks/ via git resolver (same shape as
# migtools/mta-tackle2-ui mta-fbc-e2e-pipeline).
#
# No Pipeline workspaces: Konflux IntegrationTestScenario PipelineRuns do not
# bind custom workspaces. Tasks use emptyDir volumes and pass mtaVersion via
# Task results (same no-workspace pattern as the FBC E2E pipeline).
#
# Required secrets in the Konflux namespace (names illustrative; override at
# PipelineRun bind time if needed):
#   - aws-cli-e2e-credentials: AWS API keys for EC2 provision/terminate/tag
#       (keys: aws_access_key_id, aws_secret_access_key) — mounted in OS lanes
#   - aws-vm-ssh-key: SSH private key for VM access
#       (key: ssh-privatekey → file /secrets/aws-vm-login-key.pem)
#
# No MISC_DOWNSTREAM_URL param for v1 (stage/GA artifacts are pre-published).
#
# taskRef revision: temporarily pin to this fix branch until merge; then switch to
# main (FBC convention). Until then, ITS must use a revision that contains
# these Task YAMLs without Pipeline workspaces.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: mta-cli-e2e-pipeline
spec:
  description: |
    Parse SNAPSHOT metadata, verify the component image is pullable, prepare
    the deploy workspace, then run tier0 CLI E2E on Linux, Windows, and Darwin
    AMI-backed VMs in parallel.

  params:
    - name: SNAPSHOT
      description: Application Snapshot JSON from Konflux
      type: string

    - name: AMI_LINUX
      description: AMI ID for Linux/RHEL9 E2E VM (set by IntegrationTestScenario)
      type: string
      default: ""

    - name: AMI_WINDOWS
      description: AMI ID for Windows E2E VM (set by IntegrationTestScenario)
      type: string
      default: ""

    - name: AMI_MAC
      description: AMI ID for macOS E2E VM (set by IntegrationTestScenario)
      type: string
      default: ""

    - name: AWS_REGION
      description: AWS region for EC2 instances
      type: string
      default: "us-east-1"

    - name: INSTANCE_TYPE_LINUX
      description: EC2 instance type for Linux lane
      type: string
      default: "t3.large"

    - name: INSTANCE_TYPE_WINDOWS
      description: EC2 instance type for Windows lane
      type: string
      default: "t3.large"

    - name: INSTANCE_TYPE_MAC
      description: EC2 instance type for Darwin lane
      type: string
      default: "mac2.metal"

    - name: PLATFORM_LINUX
      description: CLI binary platform for Linux lane (amd64/arm64)
      type: string
      default: "amd64"

    - name: PLATFORM_WINDOWS
      description: CLI binary platform for Windows lane (amd64/arm64)
      type: string
      default: "amd64"

    - name: PLATFORM_MAC
      description: CLI binary platform for Darwin lane (amd64/arm64); mac2.metal is arm64
      type: string
      default: "arm64"

    - name: TEST_COMMAND
      description: Remote pytest command on the test host
      type: string
      default: "pytest -s -v tests/tier0_tests.py --junitxml=junit.xml"

    - name: FAILURE_TTL_HOURS
      description: Hours to keep failed VMs tagged for debugging
      type: string
      default: "24"

    - name: SSH_USER
      description: Default SSH user for Linux/Darwin VMs
      type: string
      default: "ec2-user"

    - name: SSH_USER_WINDOWS
      description: SSH user for Windows VMs (hardcoded administrator in deploy tooling when --os windows)
      type: string
      default: "administrator"

    - name: KEY_NAME
      description: EC2 key pair name
      type: string
      default: ""

    - name: SECURITY_GROUP_ID
      description: Optional security group ID for EC2 instances
      type: string
      default: ""

    - name: SUBNET_ID
      description: Optional subnet ID for EC2 instances
      type: string
      default: ""

    - name: DEPLOY_REPO_URL
      description: Git URL of konveyor-cli-deployment (scripts + install tooling)
      type: string
      default: "https://github.com/migtools/konveyor-cli-deployment.git"

    - name: DEPLOY_REPO_REVISION
      description: Git branch or tag to clone for deploy tooling
      type: string
      default: "main"

  results:
    - name: IMAGE_VERIFICATION
      description: Pre-flight image pullability check status
      value: $(tasks.verify-image-pullable.results.verificationStatus)
    - name: TEST_OUTPUT
      description: Aggregate E2E summary (JSON)
      value: $(tasks.aggregate-results.results.summary)
    - name: LINUX_STATUS
      description: Linux lane status (PASSED|FAILED)
      value: $(tasks.linux-e2e.results.testStatus)
    - name: WINDOWS_STATUS
      description: Windows lane status (PASSED|FAILED)
      value: $(tasks.windows-e2e.results.testStatus)
    - name: DARWIN_STATUS
      description: Darwin lane status (PASSED|FAILED)
      value: $(tasks.darwin-e2e.results.testStatus)

  tasks:
    - name: parse-metadata
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/integration-examples
          - name: revision
            value: a1a70b0a1cfc96f5216d472fbd60f6b42780b3e5
          - name: pathInRepo
            value: tasks/test_metadata.yaml

    - name: verify-image-pullable
      runAfter:
        - parse-metadata
      params:
        - name: fbcImage
          value: $(tasks.parse-metadata.results.component-container-image)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/konveyor-cli-deployment
          - name: revision
            value: fix/cli-e2e-no-shared-workspace
          - name: pathInRepo
            value: .tekton/tasks/verify-image-pullable.yaml

    - name: prepare-workspace
      runAfter:
        - verify-image-pullable
      params:
        - name: fbcImage
          value: $(tasks.parse-metadata.results.component-container-image)
        - name: sshUser
          value: $(params.SSH_USER)
        - name: deployRepoUrl
          value: $(params.DEPLOY_REPO_URL)
        - name: deployRepoRevision
          value: $(params.DEPLOY_REPO_REVISION)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/konveyor-cli-deployment
          - name: revision
            value: fix/cli-e2e-no-shared-workspace
          - name: pathInRepo
            value: .tekton/tasks/prepare-workspace.yaml

    - name: linux-e2e
      runAfter:
        - prepare-workspace
      params:
        - name: targetOs
          value: linux
        - name: resultSubdir
          value: linux
        - name: ami
          value: $(params.AMI_LINUX)
        - name: instanceType
          value: $(params.INSTANCE_TYPE_LINUX)
        - name: sshUser
          value: $(params.SSH_USER)
        - name: platform
          value: $(params.PLATFORM_LINUX)
        - name: awsRegion
          value: $(params.AWS_REGION)
        - name: keyName
          value: $(params.KEY_NAME)
        - name: securityGroupId
          value: $(params.SECURITY_GROUP_ID)
        - name: subnetId
          value: $(params.SUBNET_ID)
        - name: testCommand
          value: $(params.TEST_COMMAND)
        - name: failureTtlHours
          value: $(params.FAILURE_TTL_HOURS)
        - name: sshRetries
          value: "60"
        - name: pipelineRunName
          value: $(context.pipelineRun.name)
        - name: mtaVersion
          value: $(tasks.prepare-workspace.results.mtaVersion)
        - name: fbcImage
          value: $(tasks.parse-metadata.results.component-container-image)
        - name: deployRepoUrl
          value: $(params.DEPLOY_REPO_URL)
        - name: deployRepoRevision
          value: $(params.DEPLOY_REPO_REVISION)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/konveyor-cli-deployment
          - name: revision
            value: fix/cli-e2e-no-shared-workspace
          - name: pathInRepo
            value: .tekton/tasks/run-os-e2e.yaml

    - name: windows-e2e
      runAfter:
        - prepare-workspace
      params:
        - name: targetOs
          value: windows
        - name: resultSubdir
          value: windows
        - name: ami
          value: $(params.AMI_WINDOWS)
        - name: instanceType
          value: $(params.INSTANCE_TYPE_WINDOWS)
        - name: sshUser
          value: $(params.SSH_USER_WINDOWS)
        - name: platform
          value: $(params.PLATFORM_WINDOWS)
        - name: awsRegion
          value: $(params.AWS_REGION)
        - name: keyName
          value: $(params.KEY_NAME)
        - name: securityGroupId
          value: $(params.SECURITY_GROUP_ID)
        - name: subnetId
          value: $(params.SUBNET_ID)
        - name: testCommand
          value: $(params.TEST_COMMAND)
        - name: failureTtlHours
          value: $(params.FAILURE_TTL_HOURS)
        - name: sshRetries
          value: "60"
        - name: pipelineRunName
          value: $(context.pipelineRun.name)
        - name: mtaVersion
          value: $(tasks.prepare-workspace.results.mtaVersion)
        - name: fbcImage
          value: $(tasks.parse-metadata.results.component-container-image)
        - name: deployRepoUrl
          value: $(params.DEPLOY_REPO_URL)
        - name: deployRepoRevision
          value: $(params.DEPLOY_REPO_REVISION)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/konveyor-cli-deployment
          - name: revision
            value: fix/cli-e2e-no-shared-workspace
          - name: pathInRepo
            value: .tekton/tasks/run-os-e2e.yaml

    - name: darwin-e2e
      runAfter:
        - prepare-workspace
      params:
        - name: targetOs
          value: darwin
        - name: resultSubdir
          value: darwin
        - name: ami
          value: $(params.AMI_MAC)
        - name: instanceType
          value: $(params.INSTANCE_TYPE_MAC)
        - name: sshUser
          value: $(params.SSH_USER)
        - name: platform
          value: $(params.PLATFORM_MAC)
        - name: awsRegion
          value: $(params.AWS_REGION)
        - name: keyName
          value: $(params.KEY_NAME)
        - name: securityGroupId
          value: $(params.SECURITY_GROUP_ID)
        - name: subnetId
          value: $(params.SUBNET_ID)
        - name: testCommand
          value: $(params.TEST_COMMAND)
        - name: failureTtlHours
          value: $(params.FAILURE_TTL_HOURS)
        # mac2.metal / dedicated-host boot often exceeds the default 10-minute SSH budget.
        - name: sshRetries
          value: "180"
        - name: pipelineRunName
          value: $(context.pipelineRun.name)
        - name: mtaVersion
          value: $(tasks.prepare-workspace.results.mtaVersion)
        - name: fbcImage
          value: $(tasks.parse-metadata.results.component-container-image)
        - name: deployRepoUrl
          value: $(params.DEPLOY_REPO_URL)
        - name: deployRepoRevision
          value: $(params.DEPLOY_REPO_REVISION)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/konveyor-cli-deployment
          - name: revision
            value: fix/cli-e2e-no-shared-workspace
          - name: pathInRepo
            value: .tekton/tasks/run-os-e2e.yaml

    - name: aggregate-results
      runAfter:
        - linux-e2e
        - windows-e2e
        - darwin-e2e
      params:
        - name: linuxStatus
          value: $(tasks.linux-e2e.results.testStatus)
        - name: windowsStatus
          value: $(tasks.windows-e2e.results.testStatus)
        - name: darwinStatus
          value: $(tasks.darwin-e2e.results.testStatus)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/konveyor-cli-deployment
          - name: revision
            value: fix/cli-e2e-no-shared-workspace
          - name: pathInRepo
            value: .tekton/tasks/aggregate-results.yaml

    - name: verify-results
      runAfter:
        - aggregate-results
      params:
        - name: linuxStatus
          value: $(tasks.linux-e2e.results.testStatus)
        - name: windowsStatus
          value: $(tasks.windows-e2e.results.testStatus)
        - name: darwinStatus
          value: $(tasks.darwin-e2e.results.testStatus)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/konveyor-cli-deployment
          - name: revision
            value: fix/cli-e2e-no-shared-workspace
          - name: pathInRepo
            value: .tekton/tasks/verify-results.yaml
