        - name: failureTtlHours
          value: $(params.FAILURE_TTL_HOURS)
      workspaces:
        - name: shared-workspace
          workspace: shared-workspace
      taskSpec:
        params:
          - name: ami
          - name: instanceType
          - name: sshUser
          - name: awsRegion
          - name: keyName
          - name: securityGroupId
          - name: subnetId
          - name: testCommand
          - name: failureTtlHours
        results:
          - name: testStatus
            description: Windows E2E status (PASSED|FAILED)
        workspaces:
          - name: shared-workspace
            mountPath: /workspace
        volumes:
          - name: aws-vm-ssh-key
            secret:
              secretName: aws-vm-ssh-key
              items:
                - key: ssh-privatekey
                  path: aws-vm-login-key.pem
                  mode: 0400
        steps:
          - name: run-e2e
            image: registry.access.redhat.com/ubi9/python-311:1-77.1726696540
            volumeMounts:
              - name: aws-vm-ssh-key
                mountPath: /secrets
                readOnly: true
            env:
              - name: AWS_ACCESS_KEY_ID
                valueFrom:
                  secretKeyRef:
                    name: aws-cli-e2e-credentials
                    key: aws_access_key_id
              - name: AWS_SECRET_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    name: aws-cli-e2e-credentials
                    key: aws_secret_access_key
            script: |
              #!/bin/bash
              set -euo pipefail
              RESULT_DIR=/workspace/results/windows
              mkdir -p "$RESULT_DIR"
              write_failed() {
                echo -n "FAILED" > "$RESULT_DIR/testStatus"
                cp "$RESULT_DIR/testStatus" "$(results.testStatus.path)" || true
              }
              trap 'write_failed' ERR

              # Tool bootstrap: ubi9/python-311 has python3+pip; install git,
              # openssh-clients (ssh/scp), and awscli for provision/SSH/deploy.
              microdnf install -y git openssh-clients && microdnf clean all
              pip install --quiet 'awscli'
              pip install --quiet -r /workspace/konveyor-cli-deployment/requirements.txt

              export WORK_DIR=/workspace
              export RESULT_DIR=/workspace/results/windows
              export TARGET_OS=windows
              export AMI_ID="$(params.ami)"
              export INSTANCE_TYPE="$(params.instanceType)"
              export SSH_USER="$(params.sshUser)"
              export SSH_KEY=/secrets/aws-vm-login-key.pem
              # Coupled to prepare-workspace artifact (not a separate pipeline param).
              export MTA_VERSION="$(cat /workspace/artifacts/mta-version)"
              export AWS_REGION="$(params.awsRegion)"
              export KEY_NAME="$(params.keyName)"
              export SECURITY_GROUP_ID="$(params.securityGroupId)"
              export SUBNET_ID="$(params.subnetId)"
              export TEST_COMMAND="$(params.testCommand)"
              export FAILURE_TTL_HOURS="$(params.failureTtlHours)"
              export PIPELINE_RUN_NAME="$(context.pipelineRun.name)"

              # Always record status and exit 0 so sibling lanes + aggregate still run;
              # aggregate_results.sh fails the PipelineRun if any lane is not PASSED.
              set +e
              /workspace/konveyor-cli-deployment/.tekton/integration-tests/scripts/run_os_e2e.sh
              set -e
              cp "$RESULT_DIR/testStatus" "$(results.testStatus.path)"
              # Always succeed the TaskRun; aggregate is the gate
              exit 0

    - name: darwin-e2e
      runAfter:
        - prepare-workspace
      params:
        - name: ami
          value: $(params.AMI_MAC)
        - name: instanceType
          value: $(params.INSTANCE_TYPE_MAC)
        - name: sshUser
          value: $(params.SSH_USER)
        - name: awsRegion
          value: $(params.AWS_REGION)
        - name: keyName
          value: $(params.KEY_NAME)
        - name: securityGroupId
          value: $(params.SECURITY_GROUP_ID)
        - name: subnetId
          value: $(params.SUBNET_ID)
        - name: testCommand
          value: $(params.TEST_COMMAND)
        - name: failureTtlHours
          value: $(params.FAILURE_TTL_HOURS)
      workspaces:
        - name: shared-workspace
          workspace: shared-workspace
      taskSpec:
        params:
          - name: ami
          - name: instanceType
          - name: sshUser
          - name: awsRegion
          - name: keyName
          - name: securityGroupId
          - name: subnetId
          - name: testCommand
          - name: failureTtlHours
        results:
          - name: testStatus
            description: Darwin E2E status (PASSED|FAILED)
        workspaces:
          - name: shared-workspace
            mountPath: /workspace
        volumes:
          - name: aws-vm-ssh-key
            secret:
              secretName: aws-vm-ssh-key
              items:
                - key: ssh-privatekey
                  path: aws-vm-login-key.pem
                  mode: 0400
        steps:
          - name: run-e2e
            image: registry.access.redhat.com/ubi9/python-311:1-77.1726696540
