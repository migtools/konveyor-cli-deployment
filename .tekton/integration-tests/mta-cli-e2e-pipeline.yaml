# MTA CLI E2E integration pipeline (Konflux IntegrationTestScenario).
#
# Thin Pipeline wiring Tasks from .tekton/tasks/ via git resolver (same shape as
# migtools/mta-tackle2-ui mta-fbc-e2e-pipeline).
#
# No Pipeline workspaces: Konflux IntegrationTestScenario PipelineRuns do not
# bind custom workspaces. Tasks use emptyDir volumes and pass mtaVersion via
# Task results (same no-workspace pattern as the FBC E2E pipeline).
#
# Required secrets in the Konflux namespace (names illustrative; override at
# PipelineRun bind time if needed):
#   - aws-cli-e2e-credentials: AWS API keys for EC2 provision/terminate/tag
#       (keys: aws_access_key_id, aws_secret_access_key) — mounted in OS lanes
#   - aws-vm-ssh-key: SSH private key for VM access
#       (key: ssh-privatekey → file /secrets/aws-vm-login-key.pem)
#   - kantra-cli-git-credentials: GitHub user + PAT for kantra-cli-tests .env
#       (keys: git_username, git_password) — optional mount; needed for private-repo tests
#   - slack-webhook-cli: CLI Slack Workflow trigger URL (key: url)
#       used by finally/slack-notification (not the UI E2E slack-webhook)
#
# No MISC_DOWNSTREAM_URL param for v1 (stage/GA artifacts are pre-published).
#
# taskRef revision: pin to main (FBC convention).
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: mta-cli-e2e-pipeline
spec:
  description: |
    Parse SNAPSHOT metadata, verify the component image is pullable, prepare
    the deploy workspace, then run tier0 CLI E2E on Linux, Windows, and Darwin
    AMI-backed VMs in parallel.

  params:
    - name: SNAPSHOT
      description: Application Snapshot JSON from Konflux
      type: string

    # Required: no defaults. Empty AMI_* previously reached run_os_e2e.sh as
    # "AMI_ID: parameter null or not set" after a long prepare. Set these on the
    # IntegrationTestScenario (params).
    - name: AMI_LINUX
      description: AMI ID for Linux/RHEL9 E2E VM (required; set on IntegrationTestScenario)
      type: string

    - name: AMI_WINDOWS
      description: >
        Windows E2E AMI with OpenSSH launch-key injection (EC2Launch enableOpenSsh).
        Default is pinned so lanes use passwordless SSH even if ITS omits/overrides late.
      type: string
      # Previous: ami-0745a2c03b33d9431 (earlier: ami-0bb5f8331976a99ba)
      default: "ami-08450e755659c9c46"

    - name: AMI_MAC
      description: AMI ID for macOS E2E VM (required; set on IntegrationTestScenario)
      type: string

    - name: AWS_REGION
      description: AWS region for EC2 instances
      type: string
      default: "us-east-1"

    - name: INSTANCE_TYPE_LINUX
      description: EC2 instance type for Linux lane
      type: string
      default: "t3.large"

    - name: INSTANCE_TYPE_WINDOWS
      description: >
        Windows EC2 type. Must support NestedVirtualization (Hyper-V/WSL2/Podman).
        c4/t3 do not; m7i/c7i/c8i (and newer) do.
      type: string
      # Previous: m7i.2xlarge
      default: "c8i.4xlarge"

    - name: INSTANCE_TYPE_MAC
      description: EC2 instance type for Darwin lane
      type: string
      # Previous: mac2.metal
      default: "mac2-m1ultra.metal"

    - name: PLATFORM_LINUX
      description: CLI binary platform for Linux lane (amd64/arm64)
      type: string
      default: "amd64"

    - name: PLATFORM_WINDOWS
      description: CLI binary platform for Windows lane (amd64/arm64)
      type: string
      default: "amd64"

    - name: PLATFORM_MAC
      description: CLI binary platform for Darwin lane (amd64/arm64); mac2-m1ultra.metal is arm64
      type: string
      default: "arm64"

    - name: TEST_COMMAND
      description: >
        Remote pytest command on the test host (kantra-cli-tests). ART known
        failures are always appended by run_os_e2e.sh (transform, centralconfig,
        CF, proxy container bugs, etc.).
      type: string
      default: "pytest -s -v --junitxml=junit.xml"

    - name: FAILURE_TTL_HOURS
      description: Hours to keep failed VMs tagged for debugging
      type: string
      default: "24"

    - name: SSH_USER
      description: Default SSH user for Linux/Darwin VMs
      type: string
      default: "ec2-user"

    - name: SSH_USER_WINDOWS
      description: SSH user for Windows VMs (hardcoded administrator in deploy tooling when --os windows)
      type: string
      default: "administrator"

    - name: KEY_NAME
      description: EC2 key pair name matching aws-vm-ssh-key (required; set on IntegrationTestScenario)
      type: string

    - name: SECURITY_GROUP_ID
      description: Optional security group ID for EC2 instances
      type: string
      default: ""

    - name: SUBNET_ID
      description: Optional subnet ID for EC2 instances
      type: string
      default: ""

    - name: DEPLOY_REPO_URL
      description: Git URL of konveyor-cli-deployment (scripts + install tooling)
      type: string
      default: "https://github.com/migtools/konveyor-cli-deployment.git"

    - name: DEPLOY_REPO_REVISION
      description: Git branch or tag to clone for deploy tooling
      type: string
      default: "main"

  results:
    - name: IMAGE_VERIFICATION
      description: Pre-flight image pullability check status
      value: $(tasks.verify-image-pullable.results.verificationStatus)
    - name: TEST_OUTPUT
      description: Aggregate E2E summary (JSON)
      value: $(tasks.aggregate-results.results.summary)
    - name: LINUX_STATUS
      description: Linux lane status (PASSED|FAILED)
      value: $(tasks.linux-e2e.results.testStatus)
    - name: WINDOWS_STATUS
      description: Windows lane status (PASSED|FAILED)
      value: $(tasks.windows-e2e.results.testStatus)
    - name: DARWIN_STATUS
      description: Darwin lane status (PASSED|FAILED)
      value: $(tasks.darwin-e2e.results.testStatus)

  tasks:
    - name: parse-metadata
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/integration-examples
          - name: revision
            value: a1a70b0a1cfc96f5216d472fbd60f6b42780b3e5
          - name: pathInRepo
            value: tasks/test_metadata.yaml

    - name: verify-image-pullable
      runAfter:
        - parse-metadata
      params:
        - name: fbcImage
          value: $(tasks.parse-metadata.results.component-container-image)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/konveyor-cli-deployment
          - name: revision
            value: main
          - name: pathInRepo
            value: .tekton/tasks/verify-image-pullable.yaml

    - name: prepare-workspace
      runAfter:
        - verify-image-pullable
      # PipelineTask timeout (Task.spec.timeout is rejected by Konflux Tekton).
      timeout: "20m"
      params:
        - name: fbcImage
          value: $(tasks.parse-metadata.results.component-container-image)
        - name: deployRepoUrl
          value: $(params.DEPLOY_REPO_URL)
        - name: deployRepoRevision
          value: $(params.DEPLOY_REPO_REVISION)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/konveyor-cli-deployment
          - name: revision
            value: main
          - name: pathInRepo
            value: .tekton/tasks/prepare-workspace.yaml

    - name: linux-e2e
      runAfter:
        - prepare-workspace
      # EC2 provision + SSH wait + deploy + pytest; PipelineTask timeout only.
      timeout: "2h"
      params:
        - name: targetOs
          value: linux
        - name: resultSubdir
          value: linux
        - name: ami
          value: $(params.AMI_LINUX)
        - name: instanceType
          value: $(params.INSTANCE_TYPE_LINUX)
        - name: sshUser
          value: $(params.SSH_USER)
        - name: platform
          value: $(params.PLATFORM_LINUX)
        - name: awsRegion
          value: $(params.AWS_REGION)
        - name: keyName
          value: $(params.KEY_NAME)
        - name: securityGroupId
          value: $(params.SECURITY_GROUP_ID)
        - name: subnetId
          value: $(params.SUBNET_ID)
        - name: testCommand
          value: $(params.TEST_COMMAND)
        - name: failureTtlHours
          value: $(params.FAILURE_TTL_HOURS)
        - name: sshRetries
          value: "60"
        - name: pipelineRunName
          value: $(context.pipelineRun.name)
        - name: mtaVersion
          value: $(tasks.prepare-workspace.results.mtaVersion)
        - name: fbcImage
          value: $(tasks.parse-metadata.results.component-container-image)
        - name: deployRepoUrl
          value: $(params.DEPLOY_REPO_URL)
        - name: deployRepoRevision
          value: $(params.DEPLOY_REPO_REVISION)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/konveyor-cli-deployment
          - name: revision
            value: main
          - name: pathInRepo
            value: .tekton/tasks/run-os-e2e.yaml

    - name: windows-e2e
      runAfter:
        - prepare-workspace
      timeout: "2h"
      params:
        - name: targetOs
          value: windows
        - name: resultSubdir
          value: windows
        # Pinned passwordless-SSH AMI. Hardcoded so a stale
        # IntegrationTestScenario AMI_WINDOWS value cannot override it.
        # Previous: ami-0745a2c03b33d9431 (earlier: ami-0bb5f8331976a99ba)
        - name: ami
          value: ami-08450e755659c9c46
        # Pinned nested-virt instance type so ITS cannot keep c4.xlarge/t3.large
        # (Podman machine / Hyper-V will not start without NestedVirtualization).
        # Previous: m7i.2xlarge
        - name: instanceType
          value: c8i.4xlarge
        - name: sshUser
          value: $(params.SSH_USER_WINDOWS)
        - name: platform
          value: $(params.PLATFORM_WINDOWS)
        - name: awsRegion
          value: $(params.AWS_REGION)
        - name: keyName
          value: $(params.KEY_NAME)
        - name: securityGroupId
          value: $(params.SECURITY_GROUP_ID)
        - name: subnetId
          value: $(params.SUBNET_ID)
        - name: testCommand
          value: $(params.TEST_COMMAND)
        - name: failureTtlHours
          value: $(params.FAILURE_TTL_HOURS)
        - name: sshRetries
          value: "60"
        - name: pipelineRunName
          value: $(context.pipelineRun.name)
        - name: mtaVersion
          value: $(tasks.prepare-workspace.results.mtaVersion)
        - name: fbcImage
          value: $(tasks.parse-metadata.results.component-container-image)
        - name: deployRepoUrl
          value: $(params.DEPLOY_REPO_URL)
        - name: deployRepoRevision
          value: $(params.DEPLOY_REPO_REVISION)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/konveyor-cli-deployment
          - name: revision
            value: main
          - name: pathInRepo
            value: .tekton/tasks/run-os-e2e.yaml

    - name: darwin-e2e
      runAfter:
        - prepare-workspace
      # mac2-m1ultra.metal dedicated-host boot can take a long time before SSH is up.
      timeout: "3h"
      params:
        - name: targetOs
          value: darwin
        - name: resultSubdir
          value: darwin
        - name: ami
          value: $(params.AMI_MAC)
        - name: instanceType
          value: $(params.INSTANCE_TYPE_MAC)
        - name: sshUser
          value: $(params.SSH_USER)
        - name: platform
          value: $(params.PLATFORM_MAC)
        - name: awsRegion
          value: $(params.AWS_REGION)
        - name: keyName
          value: $(params.KEY_NAME)
        - name: securityGroupId
          value: $(params.SECURITY_GROUP_ID)
        - name: subnetId
          value: $(params.SUBNET_ID)
        - name: testCommand
          value: $(params.TEST_COMMAND)
        - name: failureTtlHours
          value: $(params.FAILURE_TTL_HOURS)
        # mac2-m1ultra.metal / dedicated-host boot often exceeds the default 10-minute SSH budget.
        - name: sshRetries
          value: "180"
        - name: pipelineRunName
          value: $(context.pipelineRun.name)
        - name: mtaVersion
          value: $(tasks.prepare-workspace.results.mtaVersion)
        - name: fbcImage
          value: $(tasks.parse-metadata.results.component-container-image)
        - name: deployRepoUrl
          value: $(params.DEPLOY_REPO_URL)
        - name: deployRepoRevision
          value: $(params.DEPLOY_REPO_REVISION)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/konveyor-cli-deployment
          - name: revision
            value: main
          - name: pathInRepo
            value: .tekton/tasks/run-os-e2e.yaml

    - name: aggregate-results
      runAfter:
        - linux-e2e
        - windows-e2e
        - darwin-e2e
      params:
        - name: linuxStatus
          value: $(tasks.linux-e2e.results.testStatus)
        - name: windowsStatus
          value: $(tasks.windows-e2e.results.testStatus)
        - name: darwinStatus
          value: $(tasks.darwin-e2e.results.testStatus)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/konveyor-cli-deployment
          - name: revision
            value: main
          - name: pathInRepo
            value: .tekton/tasks/aggregate-results.yaml

    - name: verify-results
      runAfter:
        - aggregate-results
      params:
        - name: linuxStatus
          value: $(tasks.linux-e2e.results.testStatus)
        - name: windowsStatus
          value: $(tasks.windows-e2e.results.testStatus)
        - name: darwinStatus
          value: $(tasks.darwin-e2e.results.testStatus)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/konveyor-cli-deployment
          - name: revision
            value: main
          - name: pathInRepo
            value: .tekton/tasks/verify-results.yaml

  finally:
    # CLI-dedicated Slack Workflow via secret slack-webhook-cli (not UI slack-webhook).
    - name: slack-notification
      when:
        - input: "run"
          operator: in
          values: ["run"] # Set to "skip" to disable Slack notifications during testing
        - input: "$(tasks.prepare-workspace.status)"
          operator: in
          values: ["Succeeded"] # Only notify when OS lanes were attempted
      params:
        - name: linuxStatus
          value: "$(tasks.linux-e2e.status)"
        - name: windowsStatus
          value: "$(tasks.windows-e2e.status)"
        - name: darwinStatus
          value: "$(tasks.darwin-e2e.status)"
        - name: verifyStatus
          value: "$(tasks.verify-results.status)"
        - name: mtaVersion
          value: "$(tasks.prepare-workspace.results.mtaVersion)"
        - name: snapshotJson
          value: "$(params.SNAPSHOT)"
        - name: pipelineRunName
          value: "$(context.pipelineRun.name)"
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/konveyor-cli-deployment
          - name: revision
            value: main
          - name: pathInRepo
            value: .tekton/tasks/slack-notification.yaml
